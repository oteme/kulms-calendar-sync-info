<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assesment-Calender</title><style>body{font:17px/1.8 system-ui;max-width:760px;margin:60px auto;padding:0 24px;color:#203040}a{color:#125c9b}</style><h1>Assesment-Calender</h1><p>KULMS Calendar Sync は、利用者自身のPCで動作する個人用の課題締切同期ツールです。京都大学KULMSの課題を読み取り、利用者が指定したGoogleカレンダーに不足する締切を追加し、管理対象の予定を更新します。</p><p>京都大学およびGoogleの公式サービスではありません。一般向けの利用登録や、課題・認証情報を預かるサーバーは提供していません。</p><p>Googleへのアクセスには本人のOAuth認可を使用します。既存の購読予定と照合し、手動で作成した予定の変更や予定の削除は行いません。</p><p><a href="privacy.html">プライバシーポリシー</a> · <a href="https://github.com/oteme">開発者・連絡先</a></p></html>
